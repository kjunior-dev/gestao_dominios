# Example reverse proxy for a TLS terminator. Mount certificates externally.
# Worker development email transport must be replaced before production.
server {
    listen 80;
    server_name _;
    client_max_body_size 1m;
    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
