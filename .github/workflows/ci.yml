name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: devtrust
          POSTGRES_PASSWORD: ci_local_only
          POSTGRES_DB: devtrust_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U devtrust -d devtrust_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://devtrust:ci_local_only@localhost:5432/devtrust_test
      REDIS_URL: redis://localhost:6379/1
      APP_URL: http://localhost:3300
      API_INTERNAL_URL: http://localhost:4400
      API_PORT: 4400
      DEV_MAILBOX_DIR: /tmp/devtrust-ci-mailbox
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.2 }
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - name: Generate ephemeral test encryption key
        run: |
          task_totp_key="$(openssl rand -hex 32)"
          echo "::add-mask::$task_totp_key"
          echo "TOTP_ENCRYPTION_KEY=$task_totp_key" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm db:generate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm --filter @devtrust/database migrate
      - run: pnpm test:integration
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          {
            name: playwright-report,
            path: playwright-report,
            retention-days: 7,
          }
